name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Clona o código do repositório
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configura o SDK do .NET 8
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Restaura os pacotes NuGet
      - name: Restore Dependencies
        run: dotnet restore

      # 4. Compila a solução inteira
      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      # 5. Executa todos os testes (Unitários + Testcontainers)
      - name: Run All Tests
        run: dotnet test --no-build --configuration Release --verbosity normal